 shadow-sm" onclick="keypadPress('3')" type="button">3</button><button class="h-9 bg-[#FFF8EF] rounded-xl flex items-center justify-center text-sm font-bold text-[#5A3925] active:bg-[#FFE9E5] active:scale-95 transition-all shadow-sm" onclick="keypadPress('4')" type="button">4</button><button class="h-9 bg-[#FFF8EF] rounded-xl flex items-center justify-center text-sm font-bold text-[#5A3925] active:bg-[#FFE9E5] active:scale-95 transition-all shadow-sm" onclick="keypadPress('5')" type="button">5</button><button class="h-9 bg-[#FFF8EF] rounded-xl flex items-center justify-center text-sm font-bold text-[#5A3925] active:bg-[#FFE9E5] active:scale-95 transition-all shadow-sm" onclick="keypadPress('6')" type="button">6</button><button class="h-9 bg-[#FFF8EF] rounded-xl flex items-center justify-center text-sm font-bold text-[#5A3925] active:bg-[#FFE9E5] active:scale-95 transition-all shadow-sm" onclick="keypadPress('7')" type="button">7</button><button class="h-9 bg-[#FFF8EF] rounded-xl flex items-center justify-center text-sm font-bold text-[#5A3925] active:bg-[#FFE9E5] active:scale-95 transition-all shadow-sm" onclick="keypadPress('8')" type="button">8</button><button class="h-9 bg-[#FFF8EF] rounded-xl flex items-center justify-center text-sm font-bold text-[#5A3925] active:bg-[#FFE9E5] active:scale-95 transition-all shadow-sm" onclick="keypadPress('9')" type="button">9</button><button class="h-9 bg-[#FFE9E5]/60 rounded-xl flex items-center justify-center text-xs font-bold text-[#7A5B49] active:bg-[#FFE9E5] active:scale-95 transition-all shadow-sm" onclick="keypadClearHandle()" type="button">クリア</button><button class="h-9 bg-[#FFF8EF] rounded-xl flex items-center justify-center text-sm font-bold text-[#5A3925] active:bg-[#FFE9E5] active:scale-95 transition-all shadow-sm" onclick="keypadPress('0')" type="button">0</button><button aria-label="もどる" class="h-9 bg-[#FFE9E5]/60 rounded-xl flex items-center justify-center text-[#7A5B49] active:bg-[#FFE9E5] active:scale-95 transi <script>
  let currentAnswer = "";
  const correctAnswer = "56"; // 7 x 8

  function updateDisplay() {
    const display = document.getElementById("answer-display");
    const placeholder = document.getElementById("answer-placeholder");
    const caret = document.getElementById("cursor-caret");

    if (currentAnswer.length > 0) {
      display.textContent = currentAnswer;
      placeholder.style.display = "none";
    } else {
      display.textContent = "";
      placeholder.style.display = "inline";
    }
  }

  function keypadPress(digit) {
    if (currentAnswer.length < 3) {
      currentAnswer += digit;
      updateDisplay();
    }
  }

  function keypadBackspace() {
    if (currentAnswer.length > 0) {
      currentAnswer = currentAnswer.slice(0, -1);
      updateDisplay();
    }
  }

  function keypadClear() {
    currentAnswer = "";
    updateDisplay();
  }

  function handleVerify() {
    const unlockBtn = document.getElementById("btn-unlock");
    if (currentAnswer === correctAnswer) {
      unlockBtn.classList.remove("bg-primary");
      unlockBtn.classList.add("bg-secondary");
      unlockBtn.innerHTML = '<span class="material-symbols-outlined text-body-large">check_circle</span><span>せいかい！</span>';
      setTimeout(() => {
        const dialog = document.querySelector(".fixed");
        if (dialog) dialog.style.display = "none";
      }, 500);
    } else {
      // Shake on wrong answer
      const answerWell = document.querySelector("#answer-display").parentElement;
      answerWell.classList.add("translate-x-1");
      setTimeout(() => answerWell.classList.remove("translate-x-1"), 80);
      setTimeout(() => answerWell.classList.add("-translate-x-1"), 160);
      setTimeout(() => answerWell.classList.remove("-translate-x-1"), 240);
      currentAnswer = "";
      updateDisplay();
    }
  }

  function handleCancel() {
    const dialog = document.querySelector(".fixed");
    if (dialog) dialog.style.display = "none";
  }

  // Initialize display state
  updateDisplay();
</script></main>
